---
# Elastic Integrations SOC Pipeline
# See README.md for setup instructions

# =============================================================================
# WORKFLOW RULES - Prevent duplicate pipelines
# =============================================================================
workflow:
  rules:
    # Don't run branch pipeline if MR exists (prevents duplicates)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run MR pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run main branch pipelines (deploy jobs)
    - if: $CI_COMMIT_BRANCH == "main"
    # Run scheduled pipelines (merge)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Allow manual web triggers
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - merge
  - deploy

variables:
  SOPS_VERSION: "3.9.1"

# =============================================================================
# REUSABLE SCRIPT FRAGMENTS (YAML anchors)
# =============================================================================

.sops_setup: &sops_setup
  - |
    echo "Installing SOPS v${SOPS_VERSION}..."
    wget -q "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -O /usr/local/bin/sops
    chmod +x /usr/local/bin/sops
    sops --version
  - |
    echo "Setting up SOPS age key..."
    echo "$SOPS_AGE_KEY" > $CI_PROJECT_DIR/.age-key.txt
    chmod 600 $CI_PROJECT_DIR/.age-key.txt
    export SOPS_AGE_KEY_FILE="$CI_PROJECT_DIR/.age-key.txt"

.sops_decrypt_ssh_key: &sops_decrypt_ssh_key
  - |
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    sops -d ssh-key.sops > ~/.ssh/epr_deploy_key
    chmod 600 ~/.ssh/epr_deploy_key

.python_merge_setup: &python_merge_setup
  - apk add --no-cache python3 py3-pip py3-virtualenv
  - python3 -m venv .venv
  - source .venv/bin/activate
  - pip install --no-cache-dir -q -r ci/requirements-merge.txt

.python_deploy_setup: &python_deploy_setup
  - python3 -m venv .venv
  - source .venv/bin/activate
  - pip install --no-cache-dir -q -r ci/requirements-deploy.txt

.elastic_package_setup: &elastic_package_setup
  - |
    echo "Installing elastic-package CLI..."
    LATEST_VERSION=$(curl -s https://api.github.com/repos/elastic/elastic-package/releases/latest | jq -r '.tag_name')
    echo "Latest elastic-package version: $LATEST_VERSION"
    wget -q "https://github.com/elastic/elastic-package/releases/download/${LATEST_VERSION}/elastic-package_${LATEST_VERSION#v}_linux_amd64.tar.gz"
    tar -xzf "elastic-package_${LATEST_VERSION#v}_linux_amd64.tar.gz"
    mv elastic-package /usr/local/bin/
    chmod +x /usr/local/bin/elastic-package
    echo "✓ elastic-package installed"

# Matrix definitions - TARGET_ENV used by deploy script to select hardcoded config
.matrix_staging: &matrix_staging
  - TARGET_ENV: staging

.matrix_production: &matrix_production
  - TARGET_ENV: production

# =============================================================================
# MERGE STAGE: Scheduled upstream sync
# =============================================================================

merge:upstream:
  stage: merge
  image: alpine:latest
  tags: ["docker"]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git wget
    - *python_merge_setup
    # Configure git merge drivers
    - git config merge.ours.driver true
    - git config merge.manifest.driver "python3 ci/merge_manifest.py %O %A %B %L"
    - git config merge.manifest.name "Manifest field-level merge (title+version)"
    - |
      cat > .gitattributes <<'EOF'
      README.md merge=ours
      packages/*/manifest.yml merge=manifest
      packages/*/data_stream/*/manifest.yml merge=manifest
      EOF
  script:
    - source .venv/bin/activate && python3 ci/merge_upstream.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'

# =============================================================================
# DEPLOY STAGE: Build and deploy packages
# =============================================================================

.deploy_template: &deploy_template
  stage: deploy
  image: debian:latest
  tags: ["docker"]
  before_script:
    - apt-get update -qq && apt-get install -y curl wget git openssh-client rsync jq python3 python3-pip python3-venv > /dev/null
    - *sops_setup
    - *sops_decrypt_ssh_key
    - *python_deploy_setup
    - *elastic_package_setup
  script:
    - |
      echo "Deploying packages to ${TARGET_ENV} EPR..."
      source .venv/bin/activate
      python ci/detect-and-deploy.py --env ${TARGET_ENV}

deploy:staging:
  <<: *deploy_template
  environment:
    name: staging
  parallel:
    matrix: *matrix_staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/**/*
        - ci/detect-and-deploy.py
        - ci/deploy_config.py
        - ci/requirements-deploy.txt
        - ci/force-rebuild.yml
        - .gitlab-ci.yml

deploy:production:
  <<: *deploy_template
  environment:
    name: production
  parallel:
    matrix: *matrix_production
  needs:
    - job: deploy:staging
      parallel:
        matrix: *matrix_staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/**/*
        - ci/detect-and-deploy.py
        - ci/deploy_config.py
        - ci/requirements-deploy.txt
        - ci/force-rebuild.yml
        - .gitlab-ci.yml
