---
# Elastic Integrations SOC - Automated Merge and Deploy Pipeline

stages:
  - merge
  - deploy

# ============================================================================
# MERGE PIPELINE: Scheduled upstream sync
# ============================================================================
merge:upstream:
  stage: merge
  image: alpine:latest
  tags: ["docker"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0  # Full clone needed for merge
  before_script:
    # Install required tools
    - apk add --no-cache git python3 py3-pip py3-virtualenv

    # Create and activate Python venv, install dependencies
    - |
      echo "Creating Python virtual environment..."
      python3 -m venv .venv
      source .venv/bin/activate
      echo "Installing Python dependencies into venv..."
      pip install --no-cache-dir -r ci/requirements-merge.txt
      echo "✓ Python dependencies installed in venv"

    # Configure git merge driver for "ours" strategy (keeps our files during conflicts)
    - git config merge.ours.driver true
    - echo "README.md merge=ours" > .gitattributes
  script:
    # Run Python merge script (all logic moved to Python for testability)
    - source .venv/bin/activate && python3 ci/merge_upstream.py

# ============================================================================
# DEPLOY PIPELINE: Build and deploy changed packages
# ============================================================================
deploy:packages:
  stage: deploy
  image: debian:latest
  tags: ["docker"]
  rules:
    # Run on any push/merge to main branch that touches packages/ or deploy script
    # BUT NOT on scheduled pipelines (merge will trigger a new pipeline via commit)
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/**/*
        - ci/detect-and-deploy.py
        - .gitlab-ci.yml
      when: always
    - when: never
  variables:
    EPR_DEPLOY_PATH: "/opt/sva-soc-epr/packages"
  before_script:
    # Install required tools (suppress stdout, show only errors)
    - |
      apt-get update -qq
      apt-get install -y curl wget git openssh-client rsync jq python3 python3-pip python3-venv > /dev/null

    # Create and activate Python venv, install dependencies inside it
    - |
      echo "Creating Python virtual environment..."
      python3 -m venv .venv
      source .venv/bin/activate
      echo "Installing Python dependencies into venv..."
      pip install --no-cache-dir -r ci/requirements-deploy.txt
      echo "✓ Python dependencies installed in venv"

    # Install elastic-package CLI (latest version)
    - |
      echo "Installing elastic-package CLI..."
      LATEST_VERSION=$(curl -s https://api.github.com/repos/elastic/elastic-package/releases/latest | jq -r '.tag_name')
      echo "Latest elastic-package version: $LATEST_VERSION"

      wget -q "https://github.com/elastic/elastic-package/releases/download/${LATEST_VERSION}/elastic-package_${LATEST_VERSION#v}_linux_amd64.tar.gz"
      tar -xzf "elastic-package_${LATEST_VERSION#v}_linux_amd64.tar.gz"
      mv elastic-package /usr/local/bin/
      chmod +x /usr/local/bin/elastic-package

      echo "✓ elastic-package installed:"
      elastic-package version

    # Setup SSH key for EPR server access
    - |
      echo "Setting up SSH key for EPR server..."
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      # Write SSH key from CI/CD variable
      echo "$SSH_KEY_EPR" > ~/.ssh/epr_deploy_key
      chmod 600 ~/.ssh/epr_deploy_key

      # Configure SSH
      cat > ~/.ssh/config <<EOF
      Host epr-server
          HostName ${SSH_HOST_EPR}
          User ${SSH_USER_EPR}
          IdentityFile ~/.ssh/epr_deploy_key
          StrictHostKeyChecking no
          UserKnownHostsFile=/dev/null
      EOF
      chmod 600 ~/.ssh/config

      echo "✓ SSH key configured"
  script:
    # Run detect-and-deploy script (Python) using venv
    - |
      source .venv/bin/activate
      python ci/detect-and-deploy.py
